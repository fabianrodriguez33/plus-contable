services:
  postgres:
    image: postgres:16
    container_name: plus-contable-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plus_contable_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plus_contable_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
