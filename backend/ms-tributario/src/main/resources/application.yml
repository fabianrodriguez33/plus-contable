server:
  port: 8082

spring:
  config:
    # .env en la raiz del repo (ver .env.example); las variables del sistema tienen prioridad
    import: optional:file:./.env[.properties],optional:file:../../.env[.properties]
  application:
    name: ms-tributario
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plus_contable_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    # Debe ser identico al de ms-auth
    secret: ${JWT_SECRET}
  aes:
    secret-key: ${AES_SECRET_KEY}
    iv: ${AES_IV}
  cors:
    allowed-origins: http://localhost:5173
  storage:
    dir: ./uploads
