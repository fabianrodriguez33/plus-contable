server:
  # Render entrega el puerto en PORT
  port: ${PORT:8082}

spring:
  config:
    # .env en la raiz del repo (ver .env.example); las variables del sistema tienen prioridad
    import: optional:file:./.env[.properties],optional:file:../../.env[.properties]
  application:
    name: ms-tributario
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plus_contable_db}
    # Usuario propio del servicio (HT-01); si no se define, usa DB_USER y DB_PASSWORD
    username: ${TRIBUTARIO_DB_USER:${DB_USER}}
    password: ${TRIBUTARIO_DB_PASSWORD:${DB_PASSWORD}}
    # Despliegue gratis (Neon): la base se suspende tras ~5 min sin uso y corta las conexiones abiertas.
    # Una conexion vive menos que eso y se valida antes de entregarse; con 0 inactivas el pool se vacia solo.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: ${DB_MAX_LIFETIME_MS:240000}
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 0
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    # Debe ser identico al de ms-auth
    secret: ${JWT_SECRET}
  aes:
    secret-key: ${AES_SECRET_KEY}
    # IV fijo del cifrado antiguo (CBC): solo para leer valores sin prefijo v2:
    legacy-iv: ${AES_IV}
  cors:
    # Varios origenes separados por coma (CORS_ORIGINS)
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  storage:
    dir: ${STORAGE_DIR:./uploads}
  tributario:
    # HU-25: días antes del cierre del mes desde los que una compra sin clasificar avisa. Propuesta de Beto (5); configurable.
    compras:
      alerta-dias-antes-cierre: ${APP_TRIBUTARIO_COMPRAS_ALERTA_DIAS:5}
    # UIT por anio, en soles, tomada del decreto supremo del MEF de cada anio. Sin montos en el repositorio:
    # se carga por entorno (por ejemplo APP_TRIBUTARIO_UIT_2026). Sin UIT de un anio no se evalua la quinta.
    # La quinta categoria sigue apagada hasta que Beto confirme unidad y formula de proyeccion
    # (quinta-activa y quinta-sueldos-al-anio).
    # ESSALUD tambien apagado hasta confirmar la regla del estudio.
    essalud-activo: false
    quinta-activa: false
    quinta-umbral-uit: 7
    # HU-19: dias antes del plazo de respuesta de una notificacion en que llega cada alerta. Valor propuesto, por confirmar con
    # Beto (la tarjeta no lo define): 5, 3, 1 y 0 dias antes. Lista de enteros >= 0, sin repetir.
    alertas-carta-dias: 5,3,1,0
  ruc:
    # Proveedor de la consulta de RUC (HU-01). Para cambiarlo: otra implementacion de ConsultaRuc y este valor
    proveedor: openruc
    openruc:
      base-url: ${OPENRUC_BASE_URL:https://openruc.com}
      connect-timeout-ms: 2000
      read-timeout-ms: ${OPENRUC_TIMEOUT_MS:3000}
