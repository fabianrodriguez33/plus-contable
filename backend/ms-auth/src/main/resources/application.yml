server:
  port: 8081

spring:
  config:
    # .env en la raiz del repo (ver .env.example); las variables del sistema tienen prioridad
    import: optional:file:./.env[.properties],optional:file:../../.env[.properties]
  application:
    name: ms-auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plus_contable_db}
    # Usuario propio del servicio (HT-01); si no se define, usa DB_USER y DB_PASSWORD
    username: ${AUTH_DB_USER:${DB_USER}}
    password: ${AUTH_DB_PASSWORD:${DB_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

app:
  jwt:
    # Debe ser identico en ms-tributario (minimo 32 bytes)
    secret: ${JWT_SECRET}
    expiration-hours: 8
    # HU-37: vigencia del token restringido del primer ingreso (solo sirve para cambiar la contraseña)
    cambio-password-minutes: 15
  security:
    max-failed-attempts: 5
    lock-minutes: 15
    # HU-37: vigencia de la contraseña temporal desde que se crea la cuenta
    temporal-horas: 48
  cors:
    allowed-origins: http://localhost:5173
  tributario:
    # HU-37: ms-tributario, para comprobar que la empresa existe antes de crearle la cuenta
    url: ${TRIBUTARIO_URL:http://localhost:8082}
  seed:
    admin-username: ${ADMIN_USERNAME}
    admin-password: ${ADMIN_PASSWORD}
