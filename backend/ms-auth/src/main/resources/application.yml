server:
  port: 8081

spring:
  config:
    # .env en la raiz del repo (ver .env.example); las variables del sistema tienen prioridad
    import: optional:file:./.env[.properties],optional:file:../../.env[.properties]
  application:
    name: ms-auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plus_contable_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

app:
  jwt:
    # Debe ser identico en ms-tributario (minimo 32 bytes)
    secret: ${JWT_SECRET}
    expiration-hours: 8
  aes:
    # AES-256: clave de exactamente 32 caracteres, IV de exactamente 16
    secret-key: ${AES_SECRET_KEY}
    iv: ${AES_IV}
  security:
    max-failed-attempts: 5
    lock-minutes: 15
  cors:
    allowed-origins: http://localhost:5173
  seed:
    admin-username: ${ADMIN_USERNAME}
    admin-password: ${ADMIN_PASSWORD}
