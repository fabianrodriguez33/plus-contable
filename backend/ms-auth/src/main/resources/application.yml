server:
  port: 8081

spring:
  application:
    name: ms-auth
  datasource:
    url: jdbc:postgresql://localhost:5432/plus_contable_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

app:
  jwt:
    # Debe ser identico en ms-tributario (minimo 32 bytes)
    secret: ${JWT_SECRET:plus-contable-jwt-secret-key-2026-v&f-asesores-minimo-32-bytes}
    expiration-hours: 8
  security:
    max-failed-attempts: 5
    lock-minutes: 15
  cors:
    allowed-origins: http://localhost:5173
  seed:
    admin-username: admin
    admin-password: Admin123*
